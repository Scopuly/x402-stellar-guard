name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: github.repository == 'Scopuly/x402-stellar-guard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Update npm for OIDC trusted publishing
        run: npm install --global npm@11.14.1 --ignore-scripts
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module --eval "import pkg from './package.json' with {type:'json'}; if (process.env.RELEASE_TAG !== 'v' + pkg.version) throw new Error('Release tag does not match package version')"
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - name: Check one-time bootstrap publication state
        id: registry
        run: node --input-type=module --eval "import {appendFileSync,readFileSync} from 'node:fs'; import {spawnSync} from 'node:child_process'; const pkg=JSON.parse(readFileSync('package.json','utf8')); const exists=spawnSync('npm',['view',pkg.name+'@'+pkg.version,'version','--json'],{stdio:'ignore'}).status===0; if(exists && pkg.version!=='0.1.0') throw new Error('Package version is already published'); appendFileSync(process.env.GITHUB_OUTPUT,'already_published='+exists+'\n');"
      - name: Publish package with OIDC
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish
