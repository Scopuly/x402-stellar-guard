name: Bug report
description: Report a reproducible guard, receipt, or conformance problem.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include a secret key, raw signature, or production authorization entry.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Use Testnet and redact account-specific data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
